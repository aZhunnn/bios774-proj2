[project]
name = "bios774-generative-agent"
version = "0.1.0"
description = "Objective-aware foundation for an automated generative modeling agent."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "torch"]

[project.optional-dependencies]
dev = ["pytest"]
ai = ["openai", "anthropic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
